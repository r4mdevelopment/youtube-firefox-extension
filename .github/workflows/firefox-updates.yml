name: Firefox update channel
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release containing the Mozilla-signed XPI, for example v0.1.12'
        required: true
        type: string
permissions:
  contents: write
concurrency:
  group: firefox-update-channel
  cancel-in-progress: false
jobs:
  publish:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Test update publisher
        run: npm test -- tests/unit/firefox-update.test.js
      - name: Generate update channel from signed release
        env:
          RELEASE_TAG: ${{ inputs.tag || github.event.release.tag_name }}
          EVENT_NAME: ${{ github.event_name }}
        shell: bash
        run: |
          args=(--tag "$RELEASE_TAG")
          if [ "$EVENT_NAME" = release ]; then args+=(--if-signed); fi
          npm run update:firefox -- "${args[@]}"
      - name: Publish changed update manifest
        shell: bash
        run: |
          if git diff --quiet -- updates/firefox.json; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add updates/firefox.json
          git commit -m 'Update signed Firefox release channel'
          git push origin HEAD:main
